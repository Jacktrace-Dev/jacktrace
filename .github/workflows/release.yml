name: Release

# Pushing a tag like v0.1.0 builds both Windows exes and creates a DRAFT release with them and
# their SHA-256 checksums. Nothing is public until someone presses Publish on the draft.
# Before tagging, bump the versions in winres/winres.json and regenerate the .syso files
# (go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --out cmd/jacktrace/rsrc
# --arch amd64,arm64), so the exe's Properties > Details tab matches the tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # no dependencies, so no go.sum to key a cache on
      - name: Test
        run: go test ./...
      - name: Build
        run: scripts/build-windows.sh "$GITHUB_REF_NAME"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/jacktrace.exe dist/jacktrace-arm64.exe dist/SHA256SUMS.txt \
            --draft --title "JackTrace $GITHUB_REF_NAME" --generate-notes
